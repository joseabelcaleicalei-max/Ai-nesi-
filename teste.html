
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NESÍ AI — Diagnóstico</title>

  <style>
    body {
      background: #101010;
      color: #f0d078;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 { text-align: center; }

    .modulo {
      background: #202020;
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .ok { color: #55d68b; }
    .erro { color: #ff6969; }
  </style>
</head>

<body>

<h1>NESÍ AI</h1>
<p>Diagnóstico dos módulos</p>

<div id="resultado">A verificar módulos...</div>

<script src="games.js"></script>
<script src="statistics.js"></script>
<script src="analyzer.js"></script>
<script src="charts.js"></script>
<script src="validator.js"></script>
<script src="model-lab.js"></script>
<script src="storage.js"></script>
<script src="model-evaluator.js"></script>
<script src="prediction-engine.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>

<script>
const resultado = document.getElementById("resultado");

if (typeof NesiApp === "undefined") {
  resultado.textContent = "ERRO: controlador principal não carregado.";
} else {
  const diagnostico = NesiApp.inicializar();

  resultado.innerHTML = "";

  Object.entries(diagnostico.modulos).forEach(([nome, ativo]) => {
    const caixa = document.createElement("div");
    caixa.className = "modulo";

    const estado = document.createElement("strong");
    estado.className = ativo ? "ok" : "erro";
    estado.textContent = ativo ? "CARREGADO" : "NÃO CARREGADO";

    caixa.textContent = nome.toUpperCase() + ": ";
    caixa.appendChild(estado);

    resultado.appendChild(caixa);
  });

  const geral = document.createElement("div");
  geral.className = "modulo";

  const total = Object.keys(diagnostico.modulos).length;

  geral.innerHTML =
    "<h3>Estado geral</h3>" +
    "<p>" + diagnostico.estado + "</p>" +
    "<p>Módulos ativos: " +
    diagnostico.totalModulos + "/" + total + "</p>";

  resultado.appendChild(geral);

  const painel = document.createElement("div");
  painel.className = "modulo";

  painel.textContent =
    typeof NesiDashboard !== "undefined"
      ? "DASHBOARD: CARREGADO"
      : "DASHBOARD: NÃO CARREGADO";

  resultado.appendChild(painel);
}
</script>

</body>
</html>
